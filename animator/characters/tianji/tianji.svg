<?xml version="1.0" encoding="UTF-8"?>
<!--
  天机 (Tianji) — default host character for ai-video-prompt-hub/animator ("「天机」" short-video series mascot).
  Original artwork, hand-written SVG for this repository; no third-party artwork, traced images or AI images.
  Concept: a tiny sage who "leaks heaven's secrets" (泄露天机) crossed with a tech geek.
  Signature set: topknot + diagonal gold hairpin with a glowing star (antenna-like silhouette), big round
  glasses with a lens glint, small white goatee, indigo crossed-collar robe with wide sleeves, gold sash and
  star dots, a tiny compass pendant, a folding fan that opens to show </>, and a floating star buddy 小星.

  Rig convention (see animator/README.md):
    parts: star (companion, parent = root) · leg_l · leg_r · body · head ⊃ hair, glasses · fan (child of arm_r) · arm_l · arm_r
    head layers: eyes* / mouth* / expr_*   fan layers: prop_fan_closed / prop_fan_open / fx_reveal
  Z-order = document order. hair and glasses are separate parts nested in head so they always sit on top of the
  face (and of the eye layers) and move with the head. "_l" = screen-left, "_r" = screen-right.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 400" fill="none" stroke-linecap="round" stroke-linejoin="round">
